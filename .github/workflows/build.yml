name: Build Simple Waypoints - Beam Only

on:
  push:
  workflow_dispatch:

jobs:
  beam3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Build beam-only variant
        run: gradle clean build --no-daemon -PwithBeam=true

      - name: Show generated JARs
        run: ls -lah build/libs/

      - name: Upload beam-only mod
        uses: actions/upload-artifact@v4
        with:
          name: simple-waypoints-beam-only
          path: build/libs/*-beam-only-*.jar
          if-no-files-found: error
